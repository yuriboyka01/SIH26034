version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sih26034-postgres
    environment:
      POSTGRES_USER: sih26034
      POSTGRES_PASSWORD: sih26034_password
      POSTGRES_DB: sih26034
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
