services:
  - type: web
    name: sih26034-backend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && pip install -r requirements-ocr.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "https://sih26034-frontend-aygy.onrender.com,https://sih26034-frontend.onrender.com"
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: sih26034-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        value: "https://providing-reserve-sao-demonstrate.trycloudflare.com"
