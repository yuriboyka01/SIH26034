name: Deploy Frontend to GitHub Pages

# NOTE: auto-deploy-on-push disabled. Frontend is deployed via Render
# (see render.yaml) which needs vite base '/', but this job builds for
# GH Pages subpath '/SIH26034/' -> asset paths would mismatch and the
# page would render blank. Run manually only if you actually want a
# GH Pages build (and set vite base back to '/SIH26034/' first).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Install and Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
